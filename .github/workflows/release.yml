# Test every push; publish `unprofane` when pyproject.toml names a version
# PyPI does not have yet, by trusted publishing from the `pypi` environment
# (no token, with attestations), then tag it as a GitHub release. This
# repository is synced from the Unprofane monorepo by `npm run sdks:sync`;
# change the code there.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/unprofane/$v/json" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: python -m pip install build && python -m build
      - if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      # Tag the version as a GitHub release once, whether it was published
      # by this run or before (a re-created repository gets its releases back).
      - run: |
          v="v${{ steps.version.outputs.version }}"
          gh release view "$v" > /dev/null 2>&1 || gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes "Published to PyPI as unprofane==${{ steps.version.outputs.version }}."
        env:
          GH_TOKEN: ${{ github.token }}
